name: Scrape Retailer Prices

on:
  schedule:
    # Daily 06:30 VET (UTC-4 -> 10:30 UTC)
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      retailer:
        description: "Specific retailer slug to scrape (leave 'all' for all retailers)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - bahia-la-guaira
          - riomarket-caracas
          - farmatodo-ve
          - central-madeirense
          - puntoalmayor-la-guaira
          - viva-la-guaira
          - locatel-caracas

permissions:
  contents: read

concurrency:
  group: harpy-radar-scrape-retailers
  cancel-in-progress: false

jobs:
  scrape-retailers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: auto
      DB_POOL_MAX: "2"
      APP_TIMEZONE: America/Caracas
      RETAILER_SLUG: ${{ inputs.retailer }}
    steps:
      - name: Verify required DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is not configured." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run retailer price ingestion
        run: |
          if [ -n "$RETAILER_SLUG" ] && [ "$RETAILER_SLUG" != "all" ]; then
            pnpm worker:once --job=retailers --retailer="$RETAILER_SLUG" --skip-bootstrap
          else
            pnpm worker:once --job=retailers --skip-bootstrap
          fi
