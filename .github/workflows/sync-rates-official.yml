name: Sync Official BCV Rate

on:
  schedule:
    # Mon-Fri 17:30 VET and 19:00 VET (UTC-4 -> 21:30 UTC and 23:00 UTC)
    - cron: "30 21 * * 1-5"
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harpy-radar-sync-rates-official
  cancel-in-progress: false

jobs:
  sync-rates-official:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: auto
      DB_POOL_MAX: "2"
      APP_TIMEZONE: America/Caracas
      BCV_CA_CERT: ${{ secrets.BCV_CA_CERT }}
    steps:
      - name: Verify required DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is not configured." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync official BCV exchange rate
        run: pnpm worker:once --job=rates-official --skip-bootstrap
